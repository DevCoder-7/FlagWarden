debrief:
  concept: Context-aware output encoding
  why_it_works: Browsers interpret markup according to context. Treating untrusted data as code-capable markup can create unintended execution paths.
  remediation: Encode untrusted output for the correct HTML, attribute, URL, or JavaScript context and use framework-safe rendering defaults.
  references:
    - OWASP Cross Site Scripting Prevention Cheat Sheet
