[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flagwarden"
version = "2.0.0"
description = "Security-first CTF learning and challenge management platform for Telegram"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "alembic>=1.13",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-instrumentation-fastapi>=0.48b0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7", "bandit>=1.7"]
property-tests = ["hypothesis>=6.110"]

[project.scripts]
flagwarden = "flagwarden.cli:main"

[tool.setuptools.packages.find]
include = ["flagwarden*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Abaikan E402 (import), B008 (FastAPI Depends), dan aturan ketat lainnya
ignore = ["E402", "B008", "FURB192", "TRY004", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.bandit]
skips = ["B101", "B311"]